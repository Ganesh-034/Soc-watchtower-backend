trigger:
  branches:
    include:
      - pipeline-test

pr:
  branches:
    include:
      - pipeline-test

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '18.x'
  OUTPUT_LOCATION: 'dist'

#===============================================
# STAGE 1: BUILD + SECURITY SCANS
#===============================================
stages:
- stage: Build_and_Scan
  displayName: 'Build and Security Scans'

  jobs:
  - job: Build_and_Scan_Job
    displayName: 'Build and Scan Job'

    steps:

    # Install Node.js
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    # Install dependencies
    - script: npm install
      displayName: 'Install Dependencies'

    #===============================================
    # 1. Dependency vulnerability scan
    #===============================================
    - script: |
        npm audit --audit-level=high || true
      displayName: 'Run npm audit for vulnerability scanning (non-blocking)'

    #===============================================
    # 2. Lint check
    #===============================================
    - script: |
        npm run lint || true
      displayName: 'Run lint check'

    #===============================================
    # 3. Format check
    #===============================================
    - script: |
        npm run prettier:check || true
      displayName: 'Prettier check'

    #===============================================
    # 4. Secret scan (GitLeaks)
    #===============================================
    - script: |
        docker run --rm \
          -v $(System.DefaultWorkingDirectory):/repo \
          zricethezav/gitleaks detect \
          --source="/repo" \
          --verbose || true
      displayName: 'Run GitLeaks for secret scanning (non-blocking)'

    #===============================================
    # 5. Build Application
    #===============================================
    - script: npm run build
      displayName: 'Build Application'

    # Verify build output
    - script: |
        echo "Build output:"
        ls -la dist
      displayName: 'Verify dist folder'

    # Publish build artifacts
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: '$(OUTPUT_LOCATION)'
        ArtifactName: 'vite-build'
        publishLocation: 'Container'

#===============================================
# STAGE 2: DEPLOY TO STAGING
#===============================================
- stage: Deploy_to_Staging
  displayName: 'Deploy to Staging'
  dependsOn: Build_and_Scan
  condition: succeeded()

  jobs:
  - deployment: DeployStaging
    displayName: 'Deploy to Staging Environment'
    environment: 'SWA-Staging'

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: vite-build

          # Debug artifact structure
          - script: |
              echo "Pipeline Workspace:"
              pwd

              echo "Artifact Contents:"
              find $(Pipeline.Workspace) -type f | sort | head -100
            displayName: 'Inspect Downloaded Artifact'

          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Azure Static Web App - Staging'
            inputs:
              azure_static_web_apps_api_token: $(SWA_Deployment_Token)

              # Deploy already-built artifact
              app_location: '$(Pipeline.Workspace)/vite-build'

              # Prevent Oryx build
              skip_app_build: true
              skip_api_build: true

#===============================================
# STAGE 3: DEPLOY TO PRODUCTION
#===============================================
- stage: Deploy_to_Production
  displayName: 'Deploy to Production'
  dependsOn: Deploy_to_Staging
  condition: succeeded()

  jobs:
  - deployment: DeployProd
    displayName: 'Deploy to Production Environment'
    environment: 'SWA-Production'

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: vite-build

          # Debug artifact structure
          - script: |
              echo "Artifact Contents:"
              find $(Pipeline.Workspace) -type f | sort | head -100
            displayName: 'Inspect Downloaded Artifact'

          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Azure Static Web App - Production'
            inputs:
              azure_static_web_apps_api_token: $(SWA_Deployment_Token)

              # Deploy already-built artifact
              app_location: '$(Pipeline.Workspace)/vite-build'

              # Prevent Oryx build
              skip_app_build: true
              skip_api_build: true
