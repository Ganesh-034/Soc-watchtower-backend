    #   displayName: Zip Deploy to App Service (Production)
    #   condition: eq(variables['slotName'], '')
    #   inputs:
    #     azureSubscription: '${{ variables.azureSubscription }}'
    #     appType: 'webAppLinux'
    #     appName: '${{ variables.appName }}'
    #     resourceGroupName: '${{ variables.rgName }}'
    #     deployToSlotOrASE: false
    #     package: '$(Pipeline.Workspace)/${{ variables.artifactName }}/${{ variables.zipName }}'

    # Zip Deploy — when slotName is set (slot/staging)
    - task: AzureWebApp@1
      displayName: Zip Deploy to App Service (Slot)
      condition: ne(variables['slotName'], '')
      inputs:
        azureSubscription: '${{ variables.azureSubscription }}'
        appType: 'webAppLinux'
        appName: '${{ variables.appName }}'
        resourceGroupName: '${{ variables.rgName }}'
        deployToSlotOrASE: true
        slotName: '${{ variables.slotName }}'
        package: '$(Pipeline.Workspace)/${{ variables.artifactName }}/${{ variables.zipName }}'

